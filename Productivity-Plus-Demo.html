<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Productivity + - Demo</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F0F0F0;--sf:#fff;--tx:#0A0A0A;--t2:#666;--t3:#999;--bd:rgba(0,0,0,.08);--nav:rgba(255,255,255,.94);--ib:#E8E8E8;--sin:#F0F0F0;--ac:#2563EB;--gr:#06D6A0;--rd:#DC2626}
.dark{--bg:#000;--sf:#0D0D0D;--tx:#F0F0F0;--t2:#999;--t3:#555;--bd:rgba(255,255,255,.07);--nav:rgba(0,0,0,.94);--ib:#1C1C1C;--sin:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#d4d4d4;display:flex;min-height:100dvh}
.dark body{background:#161616}
#app{position:relative;width:100%;max-width:420px;height:100dvh;max-height:880px;margin:auto;overflow:hidden;background:var(--bg);color:var(--tx)}
@media(min-width:500px){#app{border-radius:40px;box-shadow:0 0 0 10px #000,0 30px 80px rgba(0,0,0,.45)}}
.tabc{position:absolute;inset:0 0 60px 0;overflow-y:auto;display:none}.tabc.on{display:block}
#nav{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--nav);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(12px);z-index:2}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:16px;font-size:10px;font-weight:600;color:var(--t3);cursor:pointer}.ni.on{background:var(--ib);color:var(--ac)}
.scr{position:absolute;inset:0;z-index:5;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}.scr.in{transform:none}
h1{font-weight:800}.pd{padding:12px 24px 40px}.sp{flex:1}
.top{padding:20px 24px 8px}.top small{font-size:13px;color:var(--t2)}.top h1{font-size:30px}
.gc{position:relative;overflow:hidden;border-radius:24px;color:#fff;cursor:pointer;margin-bottom:14px}
.gc:before,.gc:after{content:"";position:absolute;border-radius:50%;background:#fff}
.gc:before{width:160px;height:160px;right:-20px;top:-20px;opacity:.1}.gc:after{width:90px;height:90px;right:20px;top:20px;opacity:.07}
.gi{position:relative;z-index:1;height:100%;padding:24px;display:flex;align-items:center;gap:16px}
.gi b{display:block;font-size:22px;font-weight:800}.gi small{font-size:12px;opacity:.75;font-weight:500}
.hd{display:flex;align-items:center;gap:12px;padding:20px 24px 8px}.hd h1{font-size:24px}.hd p{font-size:12px;color:var(--t2)}
.bb{width:36px;height:36px;border-radius:50%;background:var(--ib);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sf);border:1px solid var(--bd);margin-left:8px;flex:none;cursor:pointer}.cb.f{background:var(--ac);color:#fff;border:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.st .card{margin:0}
.st small{display:block;font-size:11px;font-weight:600;color:var(--t2)}.st b{font-size:22px;font-weight:800}.st i{display:block;font-style:normal;font-size:10px;color:var(--t2)}
.lbl{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px}
.tr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}.tr p{font-size:15px;font-weight:500}.tr small{font-size:12px;color:var(--t3)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;cursor:pointer}.ck.on{background:var(--ac);border-color:var(--ac)}
.dn p{color:var(--t3);text-decoration:line-through}.od small{color:var(--rd)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.fab{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(37,99,235,.4);cursor:pointer;transform:translateY(-56px)}
.row{display:flex;align-items:center;gap:12px}.row>div:not(.ck):not(.sw):not(.cb){flex:1}.row b{font-size:15px;font-weight:600}.row small{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--ib);position:relative;flex:none;cursor:pointer;transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:21px}
.mini{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
.seg{display:flex;background:var(--ib);border-radius:14px;padding:3px;margin:8px 0 14px}.seg span{flex:1;text-align:center;padding:8px;border-radius:11px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.lane{display:flex;gap:12px;overflow-x:auto;padding:0 24px 40px}.col{flex:0 0 230px}.col h3{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px}.col .card{padding:12px;border-left:4px solid var(--ac)}.col b{font-size:14px;font-weight:600}.col small{display:block;font-size:12px;color:var(--t2);margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}.bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--ac)}.bl{display:flex;gap:8px;margin-top:6px}.bl span{flex:1;text-align:center;font-size:10px;color:var(--t3)}
.pr{height:8px;border-radius:4px;background:var(--ib);margin:10px 0 6px;overflow:hidden}.pr i{display:block;height:100%;border-radius:4px}
.days{display:flex;gap:8px;margin-bottom:14px}.days div{flex:1;text-align:center;padding:10px 0;border-radius:14px;background:var(--sf);border:1px solid var(--bd);font-size:11px;color:var(--t2);font-weight:600}.days b{display:block;font-size:17px;color:var(--tx);margin-top:2px}.days .on{background:var(--ac);border-color:var(--ac);color:#fff}.days .on b{color:#fff}
.dots{display:flex;gap:6px;margin-top:10px}.dots i{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.y{background:#fff}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:24px 24px 0 0;padding:12px 20px 24px;transform:translateY(100%);transition:transform .3s;z-index:21}
.so .bk{opacity:1;pointer-events:auto}.so .sh{transform:none}
.hdl{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}.sh h2{font-size:20px;font-weight:800}
.chips{display:flex;gap:8px;margin:14px 0 2px}.chips span{padding:9px 16px;border-radius:12px;background:var(--sin);border:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--t2);cursor:pointer}.chips .on{background:var(--ac);border-color:var(--ac);color:#fff}
.lb{font-size:12px;font-weight:600;color:var(--t2);margin:14px 0 6px}
.inp,.bx{width:100%;background:var(--sin);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font:15px inherit;color:var(--tx);outline:0}.bx{font-size:14px;flex:1}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:18px;cursor:pointer}
#pop{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff;background:linear-gradient(#06105D,#11407F 36%,#7E54A9 72%,#9FB8DA)}
#pop h1{font-size:44px;line-height:1.13;margin-top:auto}#pop p{font-size:24px;opacity:.86;margin:14px 0 auto}
#pop button{width:100%;height:78px;border:0;border-radius:40px;color:#fff;font-size:23px;font-weight:600;margin-top:16px;background:rgba(255,255,255,.24)}#pop .c{background:rgba(80,69,217,.84);margin-bottom:30px}
#spl{position:absolute;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s}#spl svg{animation:r 1.3s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
</style></head><body>
<div id="app">
<div class="tabc on" id="t0"></div><div class="tabc" id="t1"></div><div class="tabc" id="t2"></div>
<div id="nav"></div>
<div class="bk" onclick="shut()"></div>
<div class="sh"><div class="hdl"></div><h2>New Reminder</h2>
<div class="chips" id="chips"><span class="on">Today</span><span>Tomorrow</span><span>Pick date</span></div>
<div class="lb">Title</div><input class="inp" id="ti" placeholder="What do you need to do?">
<div class="lb">Description</div><input class="inp" placeholder="Description (optional)">
<div class="lb">Time</div><div class="row"><div class="bx">Today</div><div class="bx">9:00 AM</div></div>
<div class="bx" style="margin-top:8px;border-radius:14px">No repeat</div>
<button class="btn" onclick="mk()">Create Reminder</button></div>
<div id="pop"><h1 id="pt"></h1><p>9:30 AM</p><button class="c" onclick="pop(0)">Complete</button><button onclick="pop(0)" style="margin:0 0 44px">Dismiss</button></div>
<div id="spl"><svg width="230" height="230" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-linecap="round"><path d="M22 70A36 36 0 0 1 50 14a36 36 0 0 1 36 36" stroke-width="3.2"/><path d="M80 72A36 36 0 0 1 46 86" stroke-width=".8" opacity=".6"/><path d="M50 50l8-22M50 50l17 6" stroke-width="1.4"/><circle cx="50" cy="50" r="2.2" fill="#fff"/></svg></div>
</div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),G=[['#00B4D8','#4361EE','#7209B7'],['#F77F00','#D62828','#7209B7'],['#06D6A0','#118AB2','#073B4C'],['#F72585','#B5179E','#480CA8'],['#4F46E5','#1E40AF','#0F172A'],['#DC2626','#991B1B','#3B0A0A'],['#89AEC8','#5B8AA8','#2E5F7A'],['#B7B7D4','#8C8CB0','#5C5C8A']];
const P={bell:'M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16zM10 20a2 2 0 0 0 4 0',kanban:'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',wallet:'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l14-3v3M16 14h3',cal:'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4',line:'M3 12h18M7 7v10M12 5v14M17 8v8',moon:'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',chev:'M9 6l6 6-6 6',back:'M15 5l-7 7 7 7',add:'M12 5v14M5 12h14',chk:'M5 12l5 5 9-10',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',done:'M4 4h16v16H4zM8 12l3 3 5-6'};
const ic=(n,s=24,c='currentColor')=>{let p=P[n];if(n=='set')return`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>`;return`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p[0]=='<'?p:`<path d="${p}"/>`}</svg>`};
const gr=i=>`linear-gradient(135deg,${G[i][0]},${G[i][1]},${G[i][2]})`,gc=(i,h,x,c='')=>`<div class="gc" style="background:${gr(i)};height:${h}px" ${c}><div class="gi" style="${x}">`,E='</div></div>';
const hd=(t,s,a='')=>`<div class="hd"><div class="bb" onclick="back()">${ic('back',16)}</div><div><h1>${t}</h1><p>${s}</p></div><span class="sp"></span>${a}</div>`;
const add=`<div class="cb f" onclick="openS()">${ic('add',20)}</div>`,cbtn=n=>`<div class="cb">${ic(n,18)}</div>`;
const st=(a,b,c,d)=>`<div class="card"><small>${a}</small><b>${b}</b><i>${c||''}</i></div>`;
const bars=(v,l,col)=>`<div class="bars">${v.map(x=>`<i style="height:${x}%;${col?'background:'+col:''}"></i>`).join('')}</div><div class="bl">${l.map(x=>`<span>${x}</span>`).join('')}</div>`;
const WD=['S','M','T','W','T','F','S'];
let tasks=[{t:'Team standup',s:'Tomorrow 9:30 AM  🔁 every 1 day'},{t:'Call mom',s:'Today 7:00 PM'},{t:'Submit weekly report',s:'Fri 4:00 PM  🔁 every 1 week'},{t:'Water the plants',s:'Today 8:30 PM  🔁 every 2 days'},{t:'Renew passport',s:'Mon 11:00 AM'},{t:'Pay electricity bill',s:'Yesterday 6:00 PM',od:1}];
const trow=(x,i)=>`<div class="tr ${x.d?'dn':''} ${x.od?'od':''}"><div class="ck ${x.d?'on':''}" onclick="tasks[${i}].d=!tasks[${i}].d;ref()">${x.d?ic('chk',13,'#fff'):''}</div><div class="sp"><p>${x.t}</p><small>${x.s}</small></div>${ic('trash',20,'var(--t3)')}</div>`;
const rem=()=>{const n=tasks.filter(x=>!x.d).length;return`<div class="hd"><div class="bb" onclick="back()">${ic('back',16)}</div><h1 style="font-size:26px;flex:1">Reminders</h1><div class="cb f" style="width:44px;height:44px;background:${gr(0)}" onclick="openS()">${ic('add',22)}</div></div><div class="pd">`+[['Daily Tasks',0,Math.min(n,4)],['Personal',1,Math.max(n-4,1)]].map(p=>gc(p[1],160,'flex-direction:column;align-items:stretch;justify-content:space-between')+`<h1 style="font-size:24px;line-height:1.15">${p[0]}</h1><div class="row"><span class="pill">${p[2]} pending</span><span class="sp"></span><div class="cb" style="background:rgba(255,255,255,.2);border:0;width:36px;height:36px;color:#fff">${ic('add',22)}</div></div>`+E).join('')+`<div class="lbl">Reminders (${n})</div>`+tasks.map(trow).join('')+`<div style="position:sticky;bottom:16px;height:0;display:flex;justify-content:flex-end"><div class="fab" onclick="openS()">${ic('add',28)}</div></div></div>`};
const KD={Personal:[['Backlog',[['Plan weekend trip','Look at train routes']]],['To Do',[['Book dentist','Before month end'],['Gym plan','4 day split']]],['In Progress',[['Read Atomic Habits','Chapter 6']]],['Done',[['Renew gym membership','']]]],Work:[['Backlog',[['Refactor auth module','Tech debt'],['Write API docs','']]],['To Do',[['Review PR #214','']]],['In Progress',[['Dashboard charts','fl_chart']]],['Done',[['Fix crash on launch','Shipped'],['Sprint retro notes','']]]],Projects:[['Backlog',[['Widget extension','iOS 18']]],['To Do',[['App Store screenshots','']]],['In Progress',[['Productivity +','Notifications rework']]],['Done',[['Dark mode','']]]]};
let kp='Personal';
const kan=()=>hd('Kanban Board','Track Workflow',add)+`<div style="padding:0 24px"><div class="seg">${Object.keys(KD).map(k=>`<span class="${k==kp?'on':''}" onclick="kp='${k}';ref()">${k}</span>`).join('')}</div></div><div class="lane">`+KD[kp].map((c,ci)=>`<div class="col"><h3>${c[0].toUpperCase()}  ${c[1].length}</h3>`+c[1].map(x=>`<div class="card" style="border-left-color:${G[(ci+1)%8][0]}"><b>${x[0]}</b>${x[1]?`<small>${x[1]}</small>`:''}</div>`).join('')+`</div>`).join('')+'</div>';
const rou=()=>hd('Daily Routine','6 activities',cbtn('cal'))+`<div class="pd">`+gc(2,150,'flex-direction:column;align-items:flex-start;justify-content:center;gap:2px')+`<small>NEXT UP</small><h1 style="font-size:28px">Deep work</h1><small style="font-size:14px">10:00 AM - 90 min</small>`+E+[['Morning run','6:30 AM','30 min'],['Meditate','7:15 AM','10 min'],['Deep work','10:00 AM','90 min'],['Lunch walk','1:00 PM','20 min'],['Read','9:00 PM','30 min'],['Stretch','10:00 PM','10 min']].map(a=>`<div class="card row"><div><b>${a[0]}</b><small>${a[1]} - ${a[2]}</small></div><div class="cb f" style="background:${G[2][1]}">${ic('timer',18)}</div></div>`).join('')+'</div>';
const hab=()=>hd('Habit Tracking','5 habits',cbtn('cal')+add)+`<div class="pd">`+[['Workout',12],['Read 20 pages',8],['Meditate',21],['Drink 2L water',5],['Side project',3]].map((h,i)=>gc(i%4,120,'flex-direction:column;align-items:stretch;justify-content:center')+`<div class="row"><div><b style="font-size:20px">${h[0]}</b><small style="display:block">🔥 ${h[1]} day streak</small></div></div><div class="dots">${[1,1,0,1,1,1,i<3?1:0].map(y=>`<i class="${y?'y':''}"></i>`).join('')}</div>`+E).join('')+'</div>';
const exp=()=>hd('Expense Tracking','October',cbtn('cal')+add)+`<div class="pd"><div class="st">${st('This month','$1,842.50','vs $1,710 last month')}${st('Today','$38.20','2 entries')}</div><div class="card"><small style="font-size:11px;font-weight:600;color:var(--t2)">LAST 7 DAYS</small>${bars([40,65,30,90,55,20,45],'MTWTFSS'.split(''))}</div>`+[['Groceries',412,'#11998E,#38EF7D'],['Food',286,'#FF6B6B,#FFE66D'],['Transportation',140,'#4776E6,#8E54E9'],['Shopping',350,'#f953c6,#b91d73'],['Rent',600,'#D62828,#F77F00']].map(c=>`<div style="background:linear-gradient(135deg,${c[2]});border-radius:16px;padding:16px;margin-bottom:10px;color:#fff;display:flex;justify-content:space-between"><b>${c[0]}</b><b>$${c[1]}.00</b></div>`).join('')+'</div>';
const pla=()=>{const d=new Date();return hd('Day Planner','3 plans today',cbtn('cal')+add)+`<div class="pd"><div class="days">${[-1,0,1,2,3,4,5].map(o=>{const x=new Date(d.getTime()+o*864e5);return`<div class="${o?'':'on'}">${WD[x.getDay()]}<b>${x.getDate()}</b></div>`}).join('')}</div>`+[['8:00 AM','Gym - leg day'],['11:30 AM','Client call'],['3:00 PM','Review pull requests'],['7:30 PM','Dinner with Sam']].map((p,i)=>`<div class="card row" style="border-left:4px solid ${G[(i*2+3)%8][0]}"><b style="width:76px;flex:none;color:var(--t2);font-size:13px">${p[0]}</b><div><b>${p[1]}</b></div></div>`).join('')+'</div>'};
const tml=()=>hd('Track Timelines','4 active',add)+`<div class="pd">`+[['Launch v1.0',68,'12 days left',0],['Portfolio site',35,'30 days left',1],['Learn SwiftUI',80,'5 days left',2],['Tax filing',90,'2 days overdue',3,1]].map(t=>`<div class="card"><div class="row"><div><b style="font-size:16px">${t[0]}</b></div><small style="${t[4]?'color:var(--rd);font-weight:700':'color:var(--t2)'}">${t[2]}</small></div><div class="pr"><i style="width:${t[1]}%;background:${t[4]?'var(--rd)':gr(t[3]+4)}"></i></div><small style="font-size:11px;color:var(--t2)">${t[1]}% of time elapsed</small></div>`).join('')+`<div class="lbl">Completed</div><div class="card row"><div><b>Resume update</b><small>Finished on time</small></div><div class="ck on">${ic('chk',13,'#fff')}</div></div></div>`;
const slp=()=>hd('Sleep Tracking','Last 7 nights',cbtn('cal'))+`<div class="pd"><div class="st">${st('Average','7h 24m','last 7 nights')}${st('Last night','7h 52m','11:10 PM - 7:02 AM')}</div><div class="card"><small style="font-size:11px;font-weight:600;color:var(--t2)">HOURS SLEPT</small>${bars([78,70,92,60,84,88,82],'MTWTFSS'.split(''),'#4F46E5')}</div>`+gc(4,72,'justify-content:center;gap:10px;font-size:18px;font-weight:800')+ic('moon',22)+`Start Sleep`+E+[['Mon','7h 40m'],['Sun','8h 05m'],['Sat','6h 15m']].map(s=>`<div class="card row"><div><b>${s[0]}</b><small>Logged manually</small></div><b>${s[1]}</b></div>`).join('')+'</div>';
const M=[['Reminders','Tasks, lists & alerts','bell',0,rem],['Kanban Board','Track Workflow','kanban',1,kan],['Daily Routine','Track Activities','timer',2,rou],['Habit Tracking','Track your habits','repeat',3,hab],['Expense Tracking','Track your spending','wallet',5,exp],['Day Planner','Make plans for your day','cal',7,pla],['Track Timelines','Track your timelines','line',6,tml],['Sleep Tracking','Track your sleep','moon',4,slp]];
const home=()=>`<div class="top"><small>${H<12?'Good morning ☀️':H<17?'Good afternoon 🌤️':'Good evening 🌙'}</small><h1>Productivity +</h1></div><div class="pd" style="padding-top:12px">`+M.map((m,i)=>gc(m[3],120,'',`onclick="go(${i})"`)+ic(m[2],32,'#fff')+`<div class="sp"><b>${m[0]}</b><small>${m[1]}</small></div>`+ic('chev',24,'#fff')+E).join('')+'</div>';
const H=new Date().getHours();
const swr=(l,s,on,id)=>`<div class="card row"><div><b>${l}</b><small>${s}</small></div><div class="sw ${on?'on':''}" ${id?'id="dk"':''} onclick="${id?'dark()':"this.classList.toggle('on')"}"></div></div>`,btr=(l,s,b,f)=>`<div class="card row"><div><b>${l}</b><small>${s}</small></div><button class="mini" ${f?`onclick="${f}"`:''}>${b}</button></div>`;
const cfg=()=>`<div style="padding:20px 24px 8px"><h1 style="font-size:28px">Settings</h1></div><div class="pd"><div class="lbl">Appearance</div>${swr('Dark Mode','Switch app appearance',document.documentElement.classList.contains('dark'),1)}<div class="lbl">Notifications</div>${swr('Ringtone','Play one alert sound when reminder fires',1)}${swr('Vibrate','Vibrate when reminder fires',1)}${btr('Notification Permission','Allow notifications for reminders','Allow')}${btr('Full Screen Alerts','Preview the lock screen pop-up','Preview','pop(1)')}<div class="card row"><div><b>Reminder Schedule Window</b><small>Default (10 days)</small></div>${ic('chev',18,'var(--t3)')}</div>${swr('Prioritise Frequent Reminders','Gives minute and hour reminders more notification slots',0)}<div class="lbl">Backup</div>${btr('Export Backup','Save all app data as an XML file','Export')}${btr('Import Backup','Restore from an XML backup file','Import')}</div>`;
const done=()=>`<div style="padding:20px 24px 8px"><h1 style="font-size:28px">Done</h1><small style="font-size:12px;color:var(--t2)">Browse finished tasks by month</small></div><div class="pd"><div class="chips" style="margin-top:4px"><span class="on">2026</span><span>2025</span></div>`+[['October',4],['September',9],['August',6]].map(m=>`<div class="card row"><div><b>${m[0]}</b><small>${m[1]} completed</small></div>${ic('chev',18,'var(--t3)')}</div>`).join('')+`<div class="lbl">October</div>`+['Book flight tickets','Send invoice #482','Buy birthday gift','Update resume'].map(t=>trow({t,s:'Completed today',d:1},0).replace(/onclick="[^"]*"/,'')).join('')+'</div>';
let stack=[],tab=0;
const tabs=[['home','Home',home],['done','Done',done],['set','Settings',cfg]];
function nav(){$('#nav').innerHTML=tabs.map((t,i)=>`<div class="ni ${i==tab?'on':''}" onclick="sw(${i})">${ic(t[0],24)}${t[1]}</div>`).join('');tabs.forEach((t,i)=>{$('#t'+i).innerHTML=t[2]();$('#t'+i).classList.toggle('on',i==tab)})}
function sw(i){tab=i;nav()}
function go(i){const e=document.createElement('div');e.className='scr';e.innerHTML=M[i][4]();A.appendChild(e);stack.push({e,f:M[i][4]});e.offsetWidth;e.classList.add('in')}
function back(){const s=stack.pop();if(!s)return;s.e.classList.remove('in');setTimeout(()=>s.e.remove(),300)}
function ref(){const s=stack[stack.length-1];if(s)s.e.innerHTML=s.f();nav()}
function dark(){document.documentElement.classList.toggle('dark');$('#dk').classList.toggle('on')}
function openS(){A.classList.add('so')}function shut(){A.classList.remove('so')}
function mk(){const t=$('#ti').value.trim();tasks.unshift({t:t||'New reminder',s:$('#chips .on').textContent.replace('Pick date','Custom')+' 9:00 AM'});$('#ti').value='';shut();ref()}
function pop(v){$('#pop').style.display=v?'flex':'none';if(v)$('#pt').textContent=tasks[0].t}
$('#chips').onclick=e=>{if(e.target.tagName=='SPAN'){[...$('#chips').children].forEach(c=>c.classList.remove('on'));e.target.classList.add('on')}};
if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.classList.add('dark');
nav();setTimeout(()=>{$('#spl').style.opacity=0;setTimeout(()=>$('#spl').remove(),400)},1700);
</script></body></html>
